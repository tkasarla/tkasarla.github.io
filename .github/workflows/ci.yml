name: CI

# Pull requests only. On pushes to master the same checks run inside
# jekyll.yml, ahead of the deploy, so a failure blocks publishing.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.1'   # keep in step with .ruby-version
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint SCSS
        run: npm test

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Internal links only, against the site just built above. External links
      # are checked separately on a schedule by links.yml, so this stays fast
      # and makes no network requests.
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --exclude-path _site/assets/vendor
            '_site/**/*.html'
          fail: true
