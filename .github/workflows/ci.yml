name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.1'   # keep in step with .ruby-version
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint SCSS
        run: npm test

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Internal links only, against the site just built above. External links
      # are checked separately on a schedule by links.yml, so this stays fast
      # and makes no network requests.
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path _site/assets/vendor
            '_site/**/*.html'
          fail: true
