version: 2
updates:
  # Ruby gems — what the site is actually built from
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per week for all gem updates instead of one PR per gem.
    groups:
      gems:
        patterns: ["*"]

  # Keep GitHub Actions workflows up to date (the pinned SHAs)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Dev-only linting/formatting tools (npm test, npm run format)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-tooling:
        patterns: ["*"]
