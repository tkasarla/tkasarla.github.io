<link rel="stylesheet" href="{{ '/assets/fonts/inter/inter.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/vendor/fontawesome/css/all.min.css' | relative_url }}">

<script>
  /* Apply the saved theme before first paint so someone who chose dark does
     not see a white flash. Light is the default: the OS preference is
     deliberately not consulted. Runs in <head>, so it must not touch
     document.body. Block comments only: compress_html collapses this onto
     one line, which would turn a // comment into a comment over the whole
     script. */
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) { /* ignore */ }
    document.documentElement.setAttribute('data-theme', stored === 'dark' ? 'dark' : 'light');
  })();
</script>
