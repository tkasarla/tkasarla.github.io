<button
  class="theme-switch"
  id="theme-toggle"
  type="button"
  role="switch"
  aria-checked="false"
  aria-label="Dark theme"
  title="Toggle dark theme">
  <span class="theme-switch-track" aria-hidden="true">
    <span class="theme-switch-knob">
      <i class="fas fa-sun theme-switch-sun"></i>
      <i class="fas fa-moon theme-switch-moon"></i>
    </span>
  </span>
</button>
<script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>
